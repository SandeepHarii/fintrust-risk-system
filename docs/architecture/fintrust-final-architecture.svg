<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1010" viewBox="0 0 1340 1010"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#24609a" stroke-width="1.5"/></marker></defs><rect width="1340" height="1010" fill="#fff"/><rect width="1340" height="83" fill="#0b2b50"/><text x="36" y="39" fill="white" font-family="Arial" font-weight="bold" font-size="27">FinTrust | Transaction Insights &amp; Risk Monitoring</text><text x="36" y="64" fill="#c8e0f9" font-family="Arial" font-size="14">Final capstone implementation • Event-driven AWS architecture • October 2026</text><rect x="35" y="115" width="320" height="125" rx="12" fill="#e8f3ff" stroke="#9db4cb" stroke-width="1.5"/><text x="51" y="143" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">FRONTEND &amp; USERS</text><text x="51" y="170" font-family="Arial" fill="#233d58" font-size="15">React + Vite dashboard</text><text x="51" y="196" font-family="Arial" fill="#233d58" font-size="15">CSV upload • transaction insights</text><text x="51" y="222" font-family="Arial" fill="#233d58" font-size="15">Compliance and risk monitoring</text><rect x="425" y="115" width="320" height="125" rx="12" fill="#f0eaff" stroke="#9db4cb" stroke-width="1.5"/><text x="441" y="143" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">API LAYER</text><text x="441" y="170" font-family="Arial" fill="#233d58" font-size="15">Amazon API Gateway</text><text x="441" y="196" font-family="Arial" fill="#233d58" font-size="15">Query/API Lambda</text><text x="441" y="222" font-family="Arial" fill="#233d58" font-size="15">Transactions • insights • upload</text><rect x="805" y="115" width="350" height="125" rx="12" fill="#e8f8f2" stroke="#9db4cb" stroke-width="1.5"/><text x="821" y="143" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">DATA ACCESS</text><text x="821" y="170" font-family="Arial" fill="#233d58" font-size="15">RDS PostgreSQL: transaction ledger</text><text x="821" y="196" font-family="Arial" fill="#233d58" font-size="15">DynamoDB: risk events</text><text x="821" y="222" font-family="Arial" fill="#233d58" font-size="15">Search, filters and pagination</text><rect x="35" y="315" width="265" height="155" rx="12" fill="#e8f8f2" stroke="#9db4cb" stroke-width="1.5"/><text x="51" y="343" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">S3 RAW UPLOADS</text><text x="51" y="370" font-family="Arial" fill="#233d58" font-size="15">CSV transaction files</text><text x="51" y="396" font-family="Arial" fill="#233d58" font-size="15">Input for ingestion workflow</text><rect x="365" y="315" width="265" height="155" rx="12" fill="#fff3e6" stroke="#9db4cb" stroke-width="1.5"/><text x="381" y="343" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">INGEST LAMBDA</text><text x="381" y="370" font-family="Arial" fill="#233d58" font-size="15">Validate and parse CSV</text><text x="381" y="396" font-family="Arial" fill="#233d58" font-size="15">Invalid → S3 quarantine</text><text x="381" y="422" font-family="Arial" fill="#233d58" font-size="15">Valid → SQS FIFO</text><text x="381" y="448" font-family="Arial" fill="#233d58" font-size="15">Processed → S3 Parquet</text><rect x="695" y="315" width="265" height="155" rx="12" fill="#fcecf4" stroke="#9db4cb" stroke-width="1.5"/><text x="711" y="343" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">SQS FIFO + DLQ</text><text x="711" y="370" font-family="Arial" fill="#233d58" font-size="15">Ordered per-account messages</text><text x="711" y="396" font-family="Arial" fill="#233d58" font-size="15">Dead-letter queue for failures</text><rect x="1025" y="315" width="265" height="155" rx="12" fill="#fff3e6" stroke="#9db4cb" stroke-width="1.5"/><text x="1041" y="343" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">SCORE LAMBDA</text><text x="1041" y="370" font-family="Arial" fill="#233d58" font-size="15">Risk rules and classifications</text><text x="1041" y="396" font-family="Arial" fill="#233d58" font-size="15">Persist RDS + DynamoDB</text><text x="1041" y="422" font-family="Arial" fill="#233d58" font-size="15">Trigger high-risk alerts</text><rect x="35" y="555" width="595" height="220" rx="12" fill="#f0eaff" stroke="#9db4cb" stroke-width="1.5"/><text x="51" y="583" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">STEP FUNCTIONS STANDARD</text><text x="51" y="610" font-family="Arial" fill="#233d58" font-size="15">StartIngestion → Wait 10 seconds → CheckUploadStatus</text><text x="51" y="636" font-family="Arial" fill="#233d58" font-size="15">DynamoDB: upload_id + record_type = SUMMARY</text><text x="51" y="662" font-family="Arial" fill="#233d58" font-size="15">COMPLETED → completion notification → Succeed</text><text x="51" y="688" font-family="Arial" fill="#233d58" font-size="15">FAILED → failure notification → Fail</text><text x="51" y="714" font-family="Arial" fill="#233d58" font-size="15">Pending → repeat poll • timeout: 1 hour</text><rect x="695" y="555" width="595" height="220" rx="12" fill="#e8f3ff" stroke="#9db4cb" stroke-width="1.5"/><text x="711" y="583" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">NOTIFICATIONS &amp; REPORTING</text><text x="711" y="610" font-family="Arial" fill="#233d58" font-size="15">Alert Lambda → Amazon SES</text><text x="711" y="636" font-family="Arial" fill="#233d58" font-size="15">High-risk / upload-completed / upload-failed emails</text><text x="711" y="662" font-family="Arial" fill="#233d58" font-size="15">EventBridge → Report Lambda → S3 CSV + JSON</text><text x="711" y="688" font-family="Arial" fill="#233d58" font-size="15">CloudWatch logs, metrics and alarms • X-Ray tracing</text><rect x="35" y="845" width="1255" height="125" rx="12" fill="#f8fafc" stroke="#9db4cb" stroke-width="1.5"/><text x="51" y="873" font-family="Arial" font-weight="bold" fill="#11365e" font-size="17">RISK ENGINE • VERIFIED RULES</text><text x="51" y="900" font-family="Arial" fill="#233d58" font-size="13">HIGH_AMOUNT: &gt; R50,000 = +30   |   HIGH_VELOCITY: &gt; 10/hour = +40   |   CROSS_BORDER: countries differ = +20</text><text x="51" y="926" font-family="Arial" fill="#233d58" font-size="13">HIGH if amount or velocity rule triggers, or score ≥ 60   •   MEDIUM if score ≥ 30   •   otherwise LOW</text><text x="51" y="952" font-family="Arial" fill="#233d58" font-size="15">Capstone prototype • AWS services currently shut down • Retention automation not claimed</text><path d="M355 175 L425 175" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 175 L805 175" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M167 240 L167 315" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M300 395 L365 395" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M630 395 L695 395" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M960 395 L1025 395" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M168 470 L168 555" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1157 470 L1157 555" fill="none" stroke="#24609a" stroke-width="2.5" marker-end="url(#a)"/><text x="315" y="384" font-family="Arial" fill="#24609a" font-size="12">CSV</text><text x="640" y="384" font-family="Arial" fill="#24609a" font-size="12">valid</text><text x="969" y="384" font-family="Arial" fill="#24609a" font-size="12">score</text><text x="37" y="1000" font-family="Arial" fill="#63758b" font-size="12">Architecture overview • Source: FinTrust repository • Final Step Functions definition: fintrust-upload-workflow.json</text></svg>